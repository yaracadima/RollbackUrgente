{% extends "base.html" %}
{% block title %}Registrar película · CinePlus{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 640px;">
  <div class="card border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">
      <h1 class="h3 mb-4">Registrar película</h1>

      <form method="post" enctype="multipart/form-data">
        <div class="mb-3">
          <label for="title" class="form-label">Título</label>
          <input type="text" id="title" name="title" class="form-control" required>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-8">
            <label for="genre" class="form-label">Género</label>
            <input type="text" id="genre" name="genre" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label for="year" class="form-label">Año de estreno</label>
            <input type="number" id="year" name="year" class="form-control" required>
          </div>
        </div>
<div class="mb-3">
  <label for="synopsis" class="form-label">Sinopsis</label>
  <textarea id="synopsis" name="synopsis" class="form-control" rows="3"></textarea>
</div>

<div class="mb-3">
  <label for="director" class="form-label">Director</label>
  <input type="text" id="director" name="director" class="form-control">
</div>

<div class="mb-3">
  <label for="duration" class="form-label">Duración en minutos</label>
  <input type="number" id="duration" name="duration" min="1" class="form-control">
</div>
        <div class="mb-4">
          <label for="poster" class="form-label">Póster (opcional)</label>
          <input type="file" id="poster" name="poster" class="form-control"
                 accept="image/jpeg,image/png,image/webp"
                 aria-describedby="poster-help">
          <div id="poster-help" class="form-text">JPG, PNG o WebP.</div>
        </div>
        <fieldset class="mb-4" aria-describedby="showtime-help">
          <legend class="h5">Funciones del cine</legend>
          <div id="showtime-fields">
            <label class="form-label d-block">
              Fecha y hora de la función
              <input type="datetime-local" name="starts_at" class="form-control">
            </label>
          </div>
          <p id="showtime-help" class="form-text">Hora local de Bolivia.</p>
          <button type="button" id="add-showtime" class="btn btn-outline-primary btn-sm">
            Añadir otro horario
          </button>
        </fieldset>

        <div class="d-flex justify-content-end gap-2">
          <a href="{{ url_for('list_movies') }}" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">Guardar película</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
  const showtimeFields = document.getElementById('showtime-fields');
  document.getElementById('add-showtime').addEventListener('click', () => {
    const field = showtimeFields.firstElementChild.cloneNode(true);
    const input = field.querySelector('input');
    input.value = '';
    showtimeFields.append(field);
    input.focus();
  });
</script>
{% endblock %}
