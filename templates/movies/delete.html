
{% extends "base.html" %}

{% block title %}Eliminar pelicula · CinePlus{% endblock %}

{% block content %}

<div class="card shadow mx-auto" style="max-width:550px;">

    <div class="card-header bg-danger text-white">
        <h4>Confirmar eliminación</h4>
    </div>

    <div class="card-body text-center">

        <h5>
            ¿Está seguro de eliminar esta pelicula del catalogo?
        </h5>

        <h4 class="my-3">{{ movie.get('title', 'Sin título') }}</h4>

        <p class="text-muted">
            Esta acción no se puede deshacer.
        </p>

        <form method="POST">
            <button type="submit" class="btn btn-danger">
                Sí, eliminar
            </button>

            <a href="{{ url_for('list_movies') }}"
            class="btn btn-secondary">
                Cancelar
            </a>
        </form>

    </div>

</div>

{% endblock %}
